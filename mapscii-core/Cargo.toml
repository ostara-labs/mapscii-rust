[package]
name = "mapscii-core"
version = "0.1.0"
edition = "2021"
description = "A Braille & ASCII map renderer for terminals — embeddable ratatui widget with overlay support"
license = "MIT"

[features]
default = []
mbtiles = ["dep:rusqlite"]

[dependencies]
# TUI framework
ratatui = "0.30"

# Async runtime & HTTP
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Protobuf / vector tile parsing
prost = "0.13"

# Compression
flate2 = "1"

# Spatial indexing
rstar = "0.12"

# Polygon triangulation
earcutr = "0.4"

# Unicode width calculation
unicode-width = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GeoJSON support
geojson = "0.24"

# Cache directory
dirs = "6"

# LRU cache for tiles
lru = "0.12"

# Async utilities for concurrent operations
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"

# MBTiles (optional, requires native sqlite)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
env_logger = "0.11"

[build-dependencies]
prost-build = "0.13"
